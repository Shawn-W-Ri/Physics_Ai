<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07090d" />
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <style>{% include site.css %}</style>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$','$$'], ['\\[','\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Even · Simulation × AI</span>
      </a>
      <button class="menu-btn" aria-label="打开菜单" aria-expanded="false">☰</button>
      <nav class="nav" aria-label="主导航">
        {% for item in site.nav %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <strong>Even · Simulation × AI</strong>
        <p>Physics · PDE · Numerics · Scientific Machine Learning</p>
      </div>
      <div class="footer-links">
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/notes/' | relative_url }}">Notes</a>
        <a href="{{ '/labs/' | relative_url }}">Labs</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </div>
    </div>
  </footer>

  <script>
  (function(){
    const menu = document.querySelector('.menu-btn');
    const nav = document.querySelector('.nav');
    if(menu && nav){
      menu.addEventListener('click', function(){
        const open = nav.classList.toggle('open');
        menu.setAttribute('aria-expanded', String(open));
      });
    }

    // GitHub Pages project-site fallback:
    // if baseurl was left empty, infer /repository-name from the current URL.
    let base = '{{ site.baseurl }}';
    if(!base && location.hostname.endsWith('github.io')){
      const parts = location.pathname.split('/').filter(Boolean);
      const rootPages = new Set(['research','notes','labs','about']);
      if(parts.length && !rootPages.has(parts[0])) base = '/' + parts[0];
    }
    if(base){
      document.querySelectorAll('a[href^="/"], img[src^="/"]').forEach(function(el){
        const attr = el.tagName === 'IMG' ? 'src' : 'href';
        const value = el.getAttribute(attr);
        if(value && !value.startsWith(base + '/')) el.setAttribute(attr, base + value);
      });
    }
  })();
  </script>
</body>
</html>

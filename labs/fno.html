<section class="page-hero"><div class="container narrow"><div class="eyebrow">SCI-ML LAB</div><h1>Fourier Neural Operator · Spectral View</h1><p>通过保留有限 Fourier 模态，理解神经算子为什么会在频域里学习全局结构。</p></div></section>
<section class="section"><div class="container narrow"><div class="lab-panel"><canvas id="fnoCanvas" width="900" height="420"></canvas><div class="controls"><label>保留模态数 <input id="modes" type="range" min="1" max="20" step="1" value="5"><span id="modesV">5</span></label></div><p class="muted">黄线=原始函数；绿线=有限 Fourier 模态重建。FNO 本身比这个示意更复杂，这里只展示频域截断直觉。</p></div></div></section>
<script>(()=>{const cv=document.getElementById('fnoCanvas'),ctx=cv.getContext('2d'),me=document.getElementById('modes'),mv=document.getElementById('modesV');const N=128,x=Array.from({length:N},(_,i)=>2*Math.PI*i/N),sig=x.map(t=>.8*Math.sin(t)+.35*Math.sin(4*t)+.22*Math.cos(9*t)+.12*Math.sin(17*t));function reconstruct(M){let out=Array(N).fill(0);for(let k=0;k<=M;k++){let a=0,b=0;for(let n=0;n<N;n++){a+=sig[n]*Math.cos(k*x[n]);b+=sig[n]*Math.sin(k*x[n])}a*=2/N;b*=2/N;if(k===0)a/=2;for(let n=0;n<N;n++)out[n]+=a*Math.cos(k*x[n])+b*Math.sin(k*x[n])}return out}function draw(){let out=reconstruct(+me.value);ctx.clearRect(0,0,cv.width,cv.height);let X=i=>45+i/(N-1)*(cv.width-70),Y=y=>cv.height/2-y*(cv.height*.27);ctx.strokeStyle='#29324d';ctx.beginPath();ctx.moveTo(45,Y(0));ctx.lineTo(cv.width-25,Y(0));ctx.stroke();function line(arr,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();arr.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.stroke()}line(sig,'#ffd36a',2);line(out,'#72e6c4',3)}me.oninput=()=>{mv.textContent=me.value;draw()};draw()})();</script>

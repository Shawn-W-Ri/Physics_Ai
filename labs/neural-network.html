<section class="page-hero"><div class="container narrow"><div class="eyebrow">AI LAB</div><h1>Neural Network · Nonlinear Approximation</h1><p>用少量 tanh 隐藏单元组合函数，直观看见“线性组合 + 非线性”如何形成复杂曲线。</p></div></section>
<section class="section"><div class="container narrow"><div class="lab-panel"><canvas id="nnCanvas" width="900" height="420"></canvas><div class="controls"><label>非线性强度 <input id="gain" type="range" min="0.5" max="4" step="0.1" value="1.5"><span id="gainV">1.5</span></label><label>偏移 <input id="bias" type="range" min="-2" max="2" step="0.1" value="0"><span id="biasV">0.0</span></label></div><p class="muted">演示函数：若干 $\tanh(w_ix+b_i)$ 的加权和。重点是表达能力，不是训练过程。</p></div></div></section>
<script>(()=>{const cv=document.getElementById('nnCanvas'),ctx=cv.getContext('2d'),g=document.getElementById('gain'),gv=document.getElementById('gainV'),b=document.getElementById('bias'),bv=document.getElementById('biasV');function f(x){let k=+g.value,bb=+b.value;return .8*Math.tanh(k*(x+1)+bb)-1.1*Math.tanh(.8*k*(x-.3)-bb)+.55*Math.tanh(1.3*k*(x-1.3)+.5*bb)}function draw(){ctx.clearRect(0,0,cv.width,cv.height);let X=x=>55+(x+3)/6*(cv.width-85),Y=y=>cv.height/2-y*(cv.height*.22);ctx.strokeStyle='#29324d';for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(X(i),25);ctx.lineTo(X(i),cv.height-35);ctx.stroke()}ctx.beginPath();ctx.moveTo(55,Y(0));ctx.lineTo(cv.width-30,Y(0));ctx.stroke();ctx.strokeStyle='#72e6c4';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=300;i++){let x=-3+6*i/300,y=f(x);i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke()}g.oninput=()=>{gv.textContent=(+g.value).toFixed(1);draw()};b.oninput=()=>{bv.textContent=(+b.value).toFixed(1);draw()};draw()})();</script>

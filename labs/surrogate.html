<section class="page-hero"><div class="container narrow"><div class="eyebrow">SCI-ML LAB</div><h1>Surrogate Modeling</h1><p>把“昂贵模拟器”当黑箱，用少量样本拟合便宜代理模型。</p></div></section>
<section class="section"><div class="container narrow"><div class="lab-panel"><canvas id="surCanvas" width="900" height="420"></canvas><div class="controls"><label>训练样本数 <input id="nsamp" type="range" min="4" max="24" step="1" value="8"><span id="nsampV">8</span></label></div><p id="surInfo" class="muted"></p></div></div></section>
<script>(()=>{const cv=document.getElementById('surCanvas'),ctx=cv.getContext('2d'),ne=document.getElementById('nsamp'),nv=document.getElementById('nsampV'),info=document.getElementById('surInfo');function truef(x){return .7*Math.sin(1.3*x)+.15*x*x-.25*x}function fit(xs,ys){let S0=xs.length,S1=0,S2=0,S3=0,S4=0,T0=0,T1=0,T2=0;for(let i=0;i<xs.length;i++){let x=xs[i],y=ys[i];S1+=x;S2+=x*x;S3+=x**3;S4+=x**4;T0+=y;T1+=x*y;T2+=x*x*y}let A=[[S0,S1,S2,T0],[S1,S2,S3,T1],[S2,S3,S4,T2]];for(let i=0;i<3;i++){let p=i;for(let j=i+1;j<3;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[i],A[p]]=[A[p],A[i]];let d=A[i][i];for(let k=i;k<4;k++)A[i][k]/=d;for(let j=0;j<3;j++)if(j!==i){let q=A[j][i];for(let k=i;k<4;k++)A[j][k]-=q*A[i][k]}}return [A[0][3],A[1][3],A[2][3]]}function draw(){let n=+ne.value,xs=Array.from({length:n},(_,i)=>-3+6*i/(n-1)),ys=xs.map(truef),b=fit(xs,ys),pred=x=>b[0]+b[1]*x+b[2]*x*x;ctx.clearRect(0,0,cv.width,cv.height);let X=x=>50+(x+3)/6*(cv.width-80),Y=y=>cv.height/2-y*(cv.height*.22);ctx.strokeStyle='#29324d';ctx.beginPath();ctx.moveTo(50,Y(0));ctx.lineTo(cv.width-30,Y(0));ctx.stroke();function curve(fun,color,w){ctx.strokeStyle=color;ctx.lineWidth=w;ctx.beginPath();for(let i=0;i<=250;i++){let x=-3+6*i/250;i?ctx.lineTo(X(x),Y(fun(x))):ctx.moveTo(X(x),Y(fun(x)))}ctx.stroke()}curve(truef,'#ffd36a',2);curve(pred,'#72e6c4',3);ctx.fillStyle='#72e6c4';xs.forEach((x,i)=>{ctx.beginPath();ctx.arc(X(x),Y(ys[i]),4,0,Math.PI*2);ctx.fill()});let mse=0;for(let i=0;i<200;i++){let x=-3+6*i/199;mse+=(pred(x)-truef(x))**2}mse/=200;info.textContent='代理模型：二次多项式；测试网格 MSE ≈ '+mse.toFixed(4)+'。黄线=真实模拟器，绿线=代理。'}ne.oninput=()=>{nv.textContent=ne.value;draw()};draw()})();</script>

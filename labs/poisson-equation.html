<section class="page-hero"><div class="container narrow"><div class="eyebrow">SIMULATION LAB</div><h1>Poisson Equation · Relaxation</h1><p>求解一维模型 $-u''(x)=f(x)$，用 Jacobi 迭代观察源项如何塑造解。</p></div></section>
<section class="section"><div class="container narrow"><div class="lab-panel"><canvas id="poiCanvas" width="900" height="420"></canvas><div class="controls"><label>源项幅值 <input id="srcAmp" type="range" min="0" max="20" step="1" value="10"><span id="srcVal">10</span></label><button id="iterate" class="btn primary">迭代 100 步</button><button id="poiReset" class="btn secondary">重置</button></div><p id="resid" class="muted"></p></div></div></section>
<script>(()=>{const cv=document.getElementById('poiCanvas'),ctx=cv.getContext('2d'),amp=document.getElementById('srcAmp'),sv=document.getElementById('srcVal'),res=document.getElementById('resid');const N=120,h=1/(N-1);let u=[];function f(x){return +amp.value*Math.exp(-120*(x-.5)**2)}function init(){u=Array(N).fill(0);draw()}function iter(n){for(let k=0;k<n;k++){let v=u.slice();for(let i=1;i<N-1;i++){let x=i*h;v[i]=.5*(u[i-1]+u[i+1]+h*h*f(x))}u=v}draw()}function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#29324d';for(let j=0;j<=4;j++){let y=35+j*(cv.height-70)/4;ctx.beginPath();ctx.moveTo(45,y);ctx.lineTo(cv.width-25,y);ctx.stroke()}let m=Math.max(.001,...u.map(Math.abs));ctx.strokeStyle='#72e6c4';ctx.lineWidth=3;ctx.beginPath();u.forEach((v,i)=>{let x=45+i/(N-1)*(cv.width-70),y=cv.height-35-(v/m)*(cv.height-80);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();let rr=0;for(let i=1;i<N-1;i++){let x=i*h,r=-(u[i-1]-2*u[i]+u[i+1])/(h*h)-f(x);rr+=r*r}res.textContent='离散残差 RMS ≈ '+Math.sqrt(rr/(N-2)).toExponential(2)}amp.oninput=()=>{sv.textContent=amp.value;draw()};document.getElementById('iterate').onclick=()=>iter(100);document.getElementById('poiReset').onclick=init;init()})();</script>

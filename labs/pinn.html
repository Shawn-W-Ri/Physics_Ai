<section class="page-hero"><div class="container narrow"><div class="eyebrow">SCI-ML LAB</div><h1>PINN · PDE Residual Intuition</h1><p>用热方程解析模态附近的近似函数，观察 PDE residual 随模型参数偏离真实值而增大。</p></div></section>
<section class="section"><div class="container narrow"><div class="lab-panel"><canvas id="pinnCanvas" width="900" height="420"></canvas><div class="controls"><label>模型衰减率 λ <input id="lam" type="range" min="1" max="15" step="0.2" value="9.8"><span id="lamV">9.8</span></label><label>时间 t <input id="pt" type="range" min="0" max="0.25" step="0.01" value="0.08"><span id="ptV">0.08</span></label></div><p id="pinnInfo" class="muted"></p></div></div></section>
<script>(()=>{const cv=document.getElementById('pinnCanvas'),ctx=cv.getContext('2d'),le=document.getElementById('lam'),lv=document.getElementById('lamV'),te=document.getElementById('pt'),tv=document.getElementById('ptV'),info=document.getElementById('pinnInfo');const alpha=1,trueLam=Math.PI*Math.PI;function draw(){let lam=+le.value,t=+te.value;ctx.clearRect(0,0,cv.width,cv.height);let X=x=>50+x*(cv.width-80),Y=y=>cv.height-35-y*(cv.height-80);ctx.strokeStyle='#29324d';for(let j=0;j<=4;j++){let yy=35+j*(cv.height-70)/4;ctx.beginPath();ctx.moveTo(50,yy);ctx.lineTo(cv.width-30,yy);ctx.stroke()}ctx.strokeStyle='#72e6c4';ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=250;i++){let x=i/250,u=Math.exp(-lam*t)*Math.sin(Math.PI*x);i?ctx.lineTo(X(x),Y(u)):ctx.moveTo(X(x),Y(u))}ctx.stroke();let rms=Math.abs(trueLam-lam)*Math.exp(-lam*t)/Math.sqrt(2);info.textContent=`热方程 residual RMS ≈ ${rms.toFixed(4)}；真实 λ = π² ≈ ${trueLam.toFixed(4)}。PINN 训练的核心之一就是压低这类残差。`}le.oninput=()=>{lv.textContent=(+le.value).toFixed(1);draw()};te.oninput=()=>{tv.textContent=(+te.value).toFixed(2);draw()};draw()})();</script>

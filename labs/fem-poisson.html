<section class="page-hero"><div class="container narrow"><div class="eyebrow">NUMERICS LAB</div><h1>Finite Element Method · 1D Poisson</h1><p>线性有限元离散 $-u''=1$，比较网格节点上的 FEM 解与解析解。</p></div></section>
<section class="section"><div class="container narrow"><div class="lab-panel"><canvas id="femCanvas" width="900" height="420"></canvas><div class="controls"><label>单元数 <input id="nel" type="range" min="4" max="40" step="2" value="8"><span id="nelV">8</span></label></div><p id="femErr" class="muted"></p></div></div></section>
<script>(()=>{const cv=document.getElementById('femCanvas'),ctx=cv.getContext('2d'),ne=document.getElementById('nel'),nv=document.getElementById('nelV'),er=document.getElementById('femErr');function solve(n){let h=1/n,m=n-1,a=Array(m).fill(-1/h),b=Array(m).fill(2/h),c=Array(m).fill(-1/h),d=Array(m).fill(h);for(let i=1;i<m;i++){let w=a[i]/b[i-1];b[i]-=w*c[i-1];d[i]-=w*d[i-1]}let x=Array(m);x[m-1]=d[m-1]/b[m-1];for(let i=m-2;i>=0;i--)x[i]=(d[i]-c[i]*x[i+1])/b[i];return [0,...x,0]}function draw(){let n=+ne.value,u=solve(n);ctx.clearRect(0,0,cv.width,cv.height);let X=x=>50+x*(cv.width-80),Y=y=>cv.height-40-y/0.14*(cv.height-80);ctx.strokeStyle='#29324d';for(let j=0;j<=4;j++){let yy=35+j*(cv.height-75)/4;ctx.beginPath();ctx.moveTo(50,yy);ctx.lineTo(cv.width-30,yy);ctx.stroke()}ctx.strokeStyle='#ffd36a';ctx.lineWidth=2;ctx.beginPath();for(let k=0;k<=200;k++){let x=k/200,y=.5*x*(1-x);k?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))}ctx.stroke();ctx.strokeStyle='#72e6c4';ctx.lineWidth=3;ctx.beginPath();u.forEach((y,i)=>{let x=i/n;i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y))});ctx.stroke();ctx.fillStyle='#72e6c4';u.forEach((y,i)=>{ctx.beginPath();ctx.arc(X(i/n),Y(y),4,0,Math.PI*2);ctx.fill()});let maxe=Math.max(...u.map((y,i)=>Math.abs(y-.5*(i/n)*(1-i/n))));er.textContent='节点最大误差 ≈ '+maxe.toExponential(2)+'；黄线=解析解，绿线=FEM';}ne.oninput=()=>{nv.textContent=ne.value;draw()};draw()})();</script>

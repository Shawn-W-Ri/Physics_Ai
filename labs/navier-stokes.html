<section class="page-hero"><div class="container narrow"><div class="eyebrow">SIMULATION LAB</div><h1>Navier–Stokes · Taylor–Green Vortex</h1><p>用解析 Taylor–Green 涡展示二维不可压流的速度结构与黏性衰减。</p></div></section>
<section class="section"><div class="container narrow"><div class="lab-panel"><canvas id="nsCanvas" width="900" height="500"></canvas><div class="controls"><label>时间 t <input id="nsT" type="range" min="0" max="4" step="0.05" value="0"><span id="nsTV">0.00</span></label><label>黏性 ν <input id="nu" type="range" min="0.01" max="0.3" step="0.01" value="0.08"><span id="nuV">0.08</span></label></div><p class="muted">这是满足二维不可压 Navier–Stokes 的经典解析涡流，用于展示结构；不是通用 CFD 求解器。</p></div></div></section>
<script>(()=>{const cv=document.getElementById('nsCanvas'),ctx=cv.getContext('2d'),te=document.getElementById('nsT'),tv=document.getElementById('nsTV'),ne=document.getElementById('nu'),nv=document.getElementById('nuV');function draw(){ctx.clearRect(0,0,cv.width,cv.height);let t=+te.value,nu=+ne.value,dec=Math.exp(-2*nu*t);ctx.strokeStyle='#29324d';for(let i=0;i<=10;i++){let x=50+i*(cv.width-100)/10;ctx.beginPath();ctx.moveTo(x,35);ctx.lineTo(x,cv.height-35);ctx.stroke()}for(let j=0;j<=6;j++){let y=35+j*(cv.height-70)/6;ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(cv.width-50,y);ctx.stroke()}ctx.strokeStyle='#72e6c4';ctx.lineWidth=2;for(let i=0;i<20;i++)for(let j=0;j<11;j++){let x=2*Math.PI*i/19,y=2*Math.PI*j/10,u=Math.sin(x)*Math.cos(y)*dec,v=-Math.cos(x)*Math.sin(y)*dec;let px=50+i*(cv.width-100)/19,py=35+j*(cv.height-70)/10,s=24;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+u*s,py-v*s);ctx.stroke();ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.arc(px+u*s,py-v*s,2.2,0,Math.PI*2);ctx.fill()}}te.oninput=()=>{tv.textContent=(+te.value).toFixed(2);draw()};ne.oninput=()=>{nv.textContent=(+ne.value).toFixed(2);draw()};draw()})();</script>
